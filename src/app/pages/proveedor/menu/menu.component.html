<div class="menu-shell">

  <header class="menu-header">
    <div class="header-inner">
      <a routerLink="/proveedor" class="header-logo">
        <div class="logo-icon">
          <i class="bi bi-truck"></i>
        </div>
        <span class="logo-text">Proveedor Universal</span>
      </a>
      <div class="header-actions">
        <span class="user-greeting">Juan Pérez</span>
        <button class="btn-toggle" (click)="sidebarOpen = !sidebarOpen" aria-label="Menú">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="menu-body">

    <aside class="sidebar" [class.open]="sidebarOpen">
      <nav class="sidebar-nav">
        <a routerLink="/proveedor/menu/mis-cuentas" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-box-seam"></i>
          <span>Mis Cuentas</span>
        </a>
        <a routerLink="/proveedor/menu/mis-datos" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-person"></i>
          <span>Mis Datos</span>
        </a>
        <a routerLink="/proveedor/menu/alta-cliente" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-person-plus"></i>
          <span>Alta Cliente</span>
        </a>
        <a routerLink="/proveedor/menu/orden-compra" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-cart"></i>
          <span>Orden de Compra</span>
        </a>
        <a routerLink="/proveedor" class="sidebar-link sidebar-logout">
          <i class="bi bi-box-arrow-right"></i>
          <span>Cerrar Sesión</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <i class="bi bi-truck"></i>
        <span>Proveedor Universal</span>
      </div>
    </aside>

    <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="sidebarOpen = false"></div>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>

  </div>

  <nav class="bottom-nav">
    <a routerLink="/proveedor/menu/mis-cuentas" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-box-seam"></i>
      <span>Cuentas</span>
    </a>
    <a routerLink="/proveedor/menu/mis-datos" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-person"></i>
      <span>Datos</span>
    </a>
    <a routerLink="/proveedor/menu/alta-cliente" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-person-plus"></i>
      <span>Alta</span>
    </a>
    <a routerLink="/proveedor/menu/orden-compra" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-cart"></i>
      <span>Orden</span>
    </a>
    <a routerLink="/proveedor" class="bottom-link">
      <i class="bi bi-box-arrow-right"></i>
      <span>Salir</span>
    </a>
  </nav>

</div>
