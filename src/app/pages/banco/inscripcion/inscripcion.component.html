<div class="form-container">
  <div class="form-card">
    <h2>Alta Cuenta Bancaria</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <h3>Datos del alumno responsable</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre y Apellido</label>
          <input type="text" formControlName="nombreAlumno">
        </div>
        <div class="form-group">
          <label>Curso</label>
          <input type="text" formControlName="curso">
        </div>
        <div class="form-group">
          <label>División</label>
          <input type="text" formControlName="division">
        </div>
      </div>

      <h3>Datos de la empresa</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre Empresa</label>
          <input type="text" formControlName="nombreEmpresa">
        </div>
        <div class="form-group">
          <label>Razón Social</label>
          <input type="text" formControlName="razonSocial">
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>CUIT</label>
          <input type="text" formControlName="cuit" class="readonly-field" readonly>
        </div>
        <div class="form-group">
          <label>Actividad Principal</label>
          <input type="text" formControlName="actividadPrincipal">
        </div>
      </div>

      <h3>Domicilio legal</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Calle y Número</label>
          <input type="text" formControlName="calleNumero">
        </div>
        <div class="form-group">
          <label>Localidad</label>
          <input type="text" formControlName="localidad">
        </div>
        <div class="form-group">
          <label>Provincia</label>
          <input type="text" formControlName="provincia">
        </div>
      </div>

      <h3>Responsable</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre y Apellido</label>
          <input type="text" formControlName="nombreResponsable">
        </div>
        <div class="form-group">
          <label>Cargo</label>
          <select formControlName="cargo">
            <option value="">Seleccionar...</option>
            <option value="dueno">Dueño</option>
            <option value="administrador">Administrador</option>
            <option value="encargado">Encargado</option>
          </select>
        </div>
      </div>

      <h3>Tipo de cuenta</h3>
      <div formGroupName="tipoCuenta" class="checkbox-group">
        <label><input type="checkbox" formControlName="corriente"> Cuenta Corriente</label>
        <label><input type="checkbox" formControlName="ahorro"> Caja de Ahorro</label>
      </div>

      <h3>Uso de la cuenta</h3>
      <div formGroupName="usoCuenta" class="checkbox-group">
        <label><input type="checkbox" formControlName="pagos"> Pagos a proveedores</label>
        <label><input type="checkbox" formControlName="cobros"> Cobros</label>
        <label><input type="checkbox" formControlName="transferencias"> Transferencias</label>
        <label><input type="checkbox" formControlName="efectivo"> Manejo de efectivo</label>
      </div>

      <h3>Servicios asociados</h3>
      <div formGroupName="serviciosAsociados" class="checkbox-group">
        <label><input type="checkbox" formControlName="eCheq"> E-Cheq</label>
        <label><input type="checkbox" formControlName="debitoAutomatico"> Débito Automático</label>
        <label><input type="checkbox" formControlName="deposito"> Depósito</label>
        <label><input type="checkbox" formControlName="transferencias"> Transferencias</label>
      </div>

      <div class="form-group mt-2">
        <label>Nombre Autorizado</label>
        <input type="text" formControlName="nombreAutorizado">
      </div>

      <div class="actions">
        <button type="submit">Enviar Solicitud Banco</button>
      </div>
    </form>
  </div>
</div>
