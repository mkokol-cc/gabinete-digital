<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="hb-card shadow-lg">
                <div class="hb-header py-3 px-4">
                    <h4 class="m-0"><i class="bi bi-bank me-2"></i>Solicitud de Alta: Cuenta Bancaria</h4>
                </div>
                
                <div class="p-4">
                    <form (ngSubmit)="onSubmit()">
                        
                        <!-- SECCIÓN 1: ALUMNO -->
                        <div class="section-title mb-3 mt-2">
                            <span class="badge bg-primary">1</span>
                            <strong class="ms-2 text-uppercase text-muted small">Datos del alumno responsable</strong>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Nombre y Apellido</label>
                                <input type="text" class="form-control" placeholder="Ej: Juan Pérez">
                            </div>
                            <div class="col-6 col-md-3">
                                <label class="form-label small fw-bold">Curso</label>
                                <input type="text" class="form-control" placeholder="Ej: 5to">
                            </div>
                            <div class="col-6 col-md-3">
                                <label class="form-label small fw-bold">División</label>
                                <input type="text" class="form-control" placeholder="Ej: 'A'">
                            </div>
                        </div>

                        <!-- SECCIÓN 2: EMPRESA -->
                        <div class="section-title mb-3 mt-4">
                            <span class="badge bg-primary">2</span>
                            <strong class="ms-2 text-uppercase text-muted small">Datos de la empresa</strong>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Nombre Fantasía</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Razón Social</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">CUIT (Auto-generado)</label>
                                <input type="text" [value]="cuitAuto" readonly class="form-control bg-light text-primary fw-bold">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Actividad Principal</label>
                                <input type="text" class="form-control">
                            </div>
                        </div>

                        <!-- SECCIÓN 3: DOMICILIO Y RESPONSABLE -->
                        <div class="row mb-4">
                            <div class="col-md-6 border-end-md">
                                <h6 class="fw-bold mb-3">Domicilio Legal</h6>
                                <div class="mb-2">
                                    <label class="form-label small">Calle y Número</label>
                                    <input type="text" class="form-control form-control-sm">
                                </div>
                                <div class="row g-2">
                                    <div class="col-6"><input type="text" class="form-control form-control-sm" placeholder="Localidad"></div>
                                    <div class="col-6"><input type="text" class="form-control form-control-sm" placeholder="Provincia"></div>
                                </div>
                            </div>
                            <div class="col-md-6 mt-4 mt-md-0 ps-md-4">
                                <h6 class="fw-bold mb-3">Responsable Firmatario</h6>
                                <div class="mb-2">
                                    <label class="form-label small">Nombre completo</label>
                                    <input type="text" class="form-control form-control-sm">
                                </div>
                                <label class="form-label small">Cargo</label>
                                <select class="form-select form-select-sm">
                                    <option>Dueño</option>
                                    <option>Administrador</option>
                                    <option>Encargado</option>
                                </select>
                            </div>
                        </div>

                        <!-- SECCIÓN 4: CONFIGURACIÓN CUENTA -->
                        <div class="bg-light p-3 rounded mb-4 border">
                            <div class="row g-4">
                                <div class="col-12 col-md-4">
                                    <h6 class="small fw-bold text-primary">TIPO DE CUENTA</h6>
                                    <div class="form-check small"><input class="form-check-input" type="checkbox" id="cc"><label class="form-check-label" for="cc">Cuenta Corriente</label></div>
                                    <div class="form-check small"><input class="form-check-input" type="checkbox" id="ca"><label class="form-check-label" for="ca">Caja de Ahorro</label></div>
                                </div>
                                <div class="col-12 col-md-4">
                                    <h6 class="small fw-bold text-primary">USO PREVISTO</h6>
                                    <div class="form-check small"><input class="form-check-input" type="checkbox" id="up1"><label class="form-check-label" for="up1">Pago Proveedores</label></div>
                                    <div class="form-check small"><input class="form-check-input" type="checkbox" id="up2"><label class="form-check-label" for="up2">Transferencias</label></div>
                                </div>
                                <div class="col-12 col-md-4">
                                    <h6 class="small fw-bold text-primary">SERVICIOS</h6>
                                    <div class="form-check small"><input class="form-check-input" type="checkbox" id="s1"><label class="form-check-label" for="s1">E-Cheq</label></div>
                                    <div class="form-check small"><input class="form-check-input" type="checkbox" id="s2"><label class="form-check-label" for="s2">Débito Automático</label></div>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm">Enviar Solicitud al Banco</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
