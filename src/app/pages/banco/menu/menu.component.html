<div class="menu-shell">

  <header class="menu-header">
    <div class="header-inner">
      <a routerLink="/banco" class="header-logo">
        <img src="assets/banco/asset_0001.svg" alt="BNA" class="logo-img">
        <span class="logo-text">BNA</span>
      </a>
      <div class="header-actions">
        <span class="user-greeting">Juan Pérez</span>
        <button class="btn-toggle" (click)="sidebarOpen = !sidebarOpen" aria-label="Menú">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="menu-body">

    <aside class="sidebar" [class.open]="sidebarOpen">
      <nav class="sidebar-nav">
        <a routerLink="/banco/menu/mis-cuentas" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-wallet2"></i>
          <span>Mis Cuentas</span>
        </a>
        <a routerLink="/banco/menu/mis-datos" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-person-vcard"></i>
          <span>Mis Datos</span>
        </a>
        <a routerLink="/banco/menu/inscripcion" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-plus-circle"></i>
          <span>Inscripción</span>
        </a>
        <a routerLink="/banco/homebanking" class="sidebar-link sidebar-ext">
          <i class="bi bi-bank"></i>
          <span>Home Banking</span>
          <i class="bi bi-box-arrow-up-right ext-icon"></i>
        </a>
        <a routerLink="/banco" class="sidebar-link sidebar-logout">
          <i class="bi bi-box-arrow-right"></i>
          <span>Cerrar Sesión</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <i class="bi bi-bank"></i>
        <span>BNA 135 años</span>
      </div>
    </aside>

    <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="sidebarOpen = false"></div>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>

  </div>

  <nav class="bottom-nav">
    <a routerLink="/banco/menu/mis-cuentas" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-wallet2"></i>
      <span>Cuentas</span>
    </a>
    <a routerLink="/banco/menu/mis-datos" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-person-vcard"></i>
      <span>Datos</span>
    </a>
    <a routerLink="/banco/menu/inscripcion" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-plus-circle"></i>
      <span>Alta</span>
    </a>
    <a href="https://www.bna.com.ar" target="_blank" rel="noopener noreferrer" class="bottom-link">
      <i class="bi bi-bank"></i>
      <span>Bancar</span>
    </a>
    <a routerLink="/banco" class="bottom-link">
      <i class="bi bi-box-arrow-right"></i>
      <span>Salir</span>
    </a>
  </nav>

</div>
