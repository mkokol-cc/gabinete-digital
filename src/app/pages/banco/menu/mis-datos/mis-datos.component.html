<div class="mis-datos">
  <div class="profile-card">
    <div class="profile-header">
      <div class="avatar">
        <i class="bi bi-person-circle"></i>
      </div>
      <div class="profile-title">
        <h2>Mis Datos Personales</h2>
        <p>Información registrada en el banco</p>
      </div>
    </div>

    <div class="data-grid">
      <div class="data-item">
        <span class="label">Nombre y Apellido</span>
        <span class="value">{{ user.nombre }}</span>
      </div>
      <div class="data-item">
        <span class="label">DNI</span>
        <span class="value">{{ user.dni }}</span>
      </div>
      <div class="data-item">
        <span class="label">Correo Electrónico</span>
        <span class="value">{{ user.email }}</span>
      </div>
      <div class="data-item">
        <span class="label">Teléfono</span>
        <span class="value">{{ user.telefono }}</span>
      </div>
      <div class="data-item">
        <span class="label">Dirección</span>
        <span class="value">{{ user.direccion }}</span>
      </div>
      <div class="data-item">
        <span class="label">CBU</span>
        <span class="value">{{ user.cbu }}</span>
      </div>
      <div class="data-item">
        <span class="label">CUIT</span>
        <span class="value">{{ user.cuit }}</span>
      </div>
    </div>
  </div>
</div>
