<div class="menu-shell">

  <header class="menu-header">
    <div class="header-inner">
      <a routerLink="/inmobiliaria" class="header-logo">
        <span class="logo-text">Cesar Uran<br><small>inmobiliaria</small></span>
      </a>
      <div class="header-actions">
        <span class="user-greeting">Juan Pérez</span>
        <button class="btn-toggle" (click)="sidebarOpen = !sidebarOpen" aria-label="Menú">
          <i class="fa fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="menu-body">

    <aside class="sidebar" [class.open]="sidebarOpen">
      <nav class="sidebar-nav">
        <a routerLink="/inmobiliaria/menu/mis-cuentas" routerLinkActive="active" class="sidebar-link">
          <i class="fa fa-building"></i>
          <span>Mis Cuentas</span>
        </a>
        <a routerLink="/inmobiliaria/menu/mis-datos" routerLinkActive="active" class="sidebar-link">
          <i class="fa fa-user"></i>
          <span>Mis Datos</span>
        </a>
        <a routerLink="/inmobiliaria/menu/contrato-alquiler" routerLinkActive="active" class="sidebar-link">
          <i class="fa fa-file-text"></i>
          <span>Contrato Alquiler</span>
        </a>
        <a routerLink="/inmobiliaria" class="sidebar-link sidebar-logout">
          <i class="fa fa-sign-out"></i>
          <span>Cerrar Sesión</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <span class="sidebar-logo-text">Cesar Uran</span>
      </div>
    </aside>

    <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="sidebarOpen = false"></div>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>

  </div>

  <nav class="bottom-nav">
    <a routerLink="/inmobiliaria/menu/mis-cuentas" routerLinkActive="active" class="bottom-link">
      <i class="fa fa-building"></i>
      <span>Cuentas</span>
    </a>
    <a routerLink="/inmobiliaria/menu/mis-datos" routerLinkActive="active" class="bottom-link">
      <i class="fa fa-user"></i>
      <span>Datos</span>
    </a>
    <a routerLink="/inmobiliaria/menu/contrato-alquiler" routerLinkActive="active" class="bottom-link">
      <i class="fa fa-file-text"></i>
      <span>Contrato</span>
    </a>
    <a routerLink="/inmobiliaria" class="bottom-link">
      <i class="fa fa-sign-out"></i>
      <span>Salir</span>
    </a>
  </nav>

</div>
