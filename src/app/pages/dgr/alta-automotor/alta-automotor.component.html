<div>
  <div class="form-card">
    <h2>Alta Impuesto Automotor</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <h3>Datos del contribuyente</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre y Apellido</label>
          <input type="text" formControlName="nombreContribuyente">
        </div>
        <div class="form-group">
          <label>CUIT</label>
          <input type="text" formControlName="cuit" class="readonly-field" readonly>
        </div>
      </div>

      <h3>Datos del vehículo</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Marca</label>
          <input type="text" formControlName="marca">
        </div>
        <div class="form-group">
          <label>Modelo</label>
          <input type="text" formControlName="modelo">
        </div>
        <div class="form-group">
          <label>Año</label>
          <input type="number" formControlName="anio">
        </div>
        <div class="form-group">
          <label>Dominio / Patente</label>
          <input type="text" formControlName="dominio">
        </div>
      </div>
      <div class="form-group">
        <label>Nro Registro Automotor</label>
        <input type="text" formControlName="nroRegistroAutomotor" class="readonly-field" readonly>
      </div>

      <div class="form-group">
        <label>Declaración</label>
        <textarea formControlName="declaracion" placeholder="Detalle la declaración..."></textarea>
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" formControlName="fecha">
      </div>

      <div class="actions">
        <button type="submit">Enviar Alta Automotor</button>
      </div>
    </form>
  </div>
</div>
