<!-- Formulario de ejemplo -->
<div class="mt-5">
    <h4 class="mb-4">Ejemplo de Formulario de Trámite</h4>
    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow-lg">
                <div class="card-body">
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" placeholder="Juan Pérez">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">DNI</label>
                                <input type="text" class="form-control" placeholder="12.345.678">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" placeholder="ejemplo@email.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" placeholder="3533 422150">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Tipo de trámite</label>
                                <select class="form-select">
                                    <option>Seleccionar...</option>
                                    <option>Certificado de domicilio</option>
                                    <option>Pago de tasas</option>
                                    <option>Consulta de deuda</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" rows="4" placeholder="Detalle el trámite..."></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary px-5">Enviar Trámite</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
