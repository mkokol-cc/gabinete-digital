<div class="menu-shell">

  <header class="menu-header">
    <div class="header-inner">
      <a routerLink="/muni" class="header-logo">
        <img src="assets/muni/logo.png" alt="Municipalidad de Las Varillas" class="logo-img">
        <span class="logo-text">Municipalidad de Las Varillas</span>
      </a>
      <div class="header-actions">
        <span class="user-greeting">Juan Pérez</span>
        <button class="btn-toggle" (click)="sidebarOpen = !sidebarOpen" aria-label="Menú">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="menu-body">

    <aside class="sidebar" [class.open]="sidebarOpen">
      <nav class="sidebar-nav">
        <a routerLink="/muni/menu/mis-cuentas" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-house-door"></i>
          <span>Mis Cuentas</span>
        </a>
        <a routerLink="/muni/menu/mis-datos" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-person-vcard"></i>
          <span>Mis Datos</span>
        </a>
        <a routerLink="/muni/menu/alta-comercio-industria" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-shop"></i>
          <span>Alta Comercio/Industria</span>
        </a>
        <a routerLink="/muni/menu/alta-tasa-inmuebles" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-building"></i>
          <span>Alta Tasa Inmuebles</span>
        </a>
        <a routerLink="/muni/menu/alta-patente-municipal" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-truck-front"></i>
          <span>Alta Patente Municipal</span>
        </a>
        <a routerLink="/muni" class="sidebar-link sidebar-logout">
          <i class="bi bi-box-arrow-right"></i>
          <span>Cerrar Sesión</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <img src="assets/muni/logo.png" alt="Muni" class="sidebar-logo">
      </div>
    </aside>

    <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="sidebarOpen = false"></div>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>

  </div>

  <nav class="bottom-nav">
    <a routerLink="/muni/menu/mis-cuentas" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-house-door"></i>
      <span>Cuentas</span>
    </a>
    <a routerLink="/muni/menu/mis-datos" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-person-vcard"></i>
      <span>Datos</span>
    </a>
    <a routerLink="/muni/menu/alta-comercio-industria" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-shop"></i>
      <span>Comercio</span>
    </a>
    <a routerLink="/muni/menu/alta-tasa-inmuebles" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-building"></i>
      <span>Tasa</span>
    </a>
    <a routerLink="/muni/menu/alta-patente-municipal" routerLinkActive="active" class="bottom-link">
      <i class="bi bi-truck-front"></i>
      <span>Patente</span>
    </a>
    <a routerLink="/muni" class="bottom-link">
      <i class="bi bi-box-arrow-right"></i>
      <span>Salir</span>
    </a>
  </nav>

</div>
