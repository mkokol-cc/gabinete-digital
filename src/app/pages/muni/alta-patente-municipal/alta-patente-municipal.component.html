<div class="form-container">
  <div class="form-card">
    <h2>Alta Patente Municipal</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <h3>Datos del alumno responsable</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre y Apellido</label>
          <input type="text" formControlName="nombreAlumno">
        </div>
        <div class="form-group">
          <label>Curso</label>
          <input type="text" formControlName="curso">
        </div>
        <div class="form-group">
          <label>División</label>
          <input type="text" formControlName="division">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Nombre Empresa</label>
          <input type="text" formControlName="nombreEmpresa">
        </div>
        <div class="form-group">
          <label>CUIT</label>
          <input type="text" formControlName="cuit" class="readonly-field" readonly>
        </div>
      </div>

      <h3>Datos del vehículo</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Marca</label>
          <input type="text" formControlName="marca">
        </div>
        <div class="form-group">
          <label>Modelo</label>
          <input type="text" formControlName="modelo">
        </div>
        <div class="form-group">
          <label>Año</label>
          <input type="number" formControlName="anio">
        </div>
        <div class="form-group">
          <label>Dominio / Patente</label>
          <input type="text" formControlName="dominio">
        </div>
      </div>
      <div class="form-group">
        <label>Nro Registro Municipal</label>
        <input type="text" formControlName="nroRegistroMunicipal" class="readonly-field" readonly>
      </div>

      <div class="form-group">
        <label>Declaración</label>
        <textarea formControlName="declaracion" placeholder="Detalle la declaración..."></textarea>
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" formControlName="fecha">
      </div>

      <div class="actions">
        <button type="submit">Enviar Alta Patente</button>
      </div>
    </form>
  </div>
</div>
