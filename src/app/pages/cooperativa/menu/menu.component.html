<div class="menu-shell">

  <header class="menu-header">
    <div class="header-inner">
      <a routerLink="/cooperativa" class="header-logo">
        <img src="assets/cooperativa/logo.png" alt="Cooperativa Las Varillas" class="logo-img">
        <span class="logo-text">Cooperativa Las Varillas</span>
      </a>
      <div class="header-actions">
        <span class="user-greeting">Juan Pérez</span>
        <button class="btn-toggle" (click)="sidebarOpen = !sidebarOpen" aria-label="Menú">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="menu-body">

    <aside class="sidebar" [class.open]="sidebarOpen">
      <nav class="sidebar-nav">
        <a routerLink="/cooperativa/menu/mis-cuentas" routerLinkActive="active" class="sidebar-link">
          <i class="fas fa-home"></i>
          <span>Mis Cuentas</span>
        </a>
        <a routerLink="/cooperativa/menu/mis-datos" routerLinkActive="active" class="sidebar-link">
          <i class="fas fa-user"></i>
          <span>Mis Datos</span>
        </a>
        <a routerLink="/cooperativa/menu/alta-servicios" routerLinkActive="active" class="sidebar-link">
          <i class="fas fa-bolt"></i>
          <span>Alta Servicios</span>
        </a>
        <a routerLink="/cooperativa" class="sidebar-link sidebar-logout">
          <i class="fas fa-sign-out-alt"></i>
          <span>Cerrar Sesión</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <img src="assets/cooperativa/logo.png" alt="Cooperativa" class="sidebar-logo">
      </div>
    </aside>

    <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="sidebarOpen = false"></div>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>

  </div>

  <nav class="bottom-nav">
    <a routerLink="/cooperativa/menu/mis-cuentas" routerLinkActive="active" class="bottom-link">
      <i class="fas fa-home"></i>
      <span>Cuentas</span>
    </a>
    <a routerLink="/cooperativa/menu/mis-datos" routerLinkActive="active" class="bottom-link">
      <i class="fas fa-user"></i>
      <span>Datos</span>
    </a>
    <a routerLink="/cooperativa/menu/alta-servicios" routerLinkActive="active" class="bottom-link">
      <i class="fas fa-bolt"></i>
      <span>Alta</span>
    </a>
    <a routerLink="/cooperativa" class="bottom-link">
      <i class="fas fa-sign-out-alt"></i>
      <span>Salir</span>
    </a>
  </nav>

</div>
