<div class="mis-datos">

  <div class="perfil-header">
    <div class="perfil-avatar">
      <i class="fas fa-user"></i>
    </div>
    <div class="perfil-titulo">
      <h1>{{ usuario.nombre }}</h1>
      <p>Tus datos personales</p>
    </div>
  </div>

  <div class="datos-card">
    <div class="datos-grid">
      <div class="dato-item">
        <span class="dato-label"><i class="fas fa-id-card"></i> Socio N°</span>
        <span class="dato-valor">{{ usuario.socio }}</span>
      </div>
      <div class="dato-item">
        <span class="dato-label"><i class="fas fa-envelope"></i> Email</span>
        <span class="dato-valor">{{ usuario.email }}</span>
      </div>
      <div class="dato-item">
        <span class="dato-label"><i class="fas fa-phone"></i> Teléfono</span>
        <span class="dato-valor">{{ usuario.telefono }}</span>
      </div>
      <div class="dato-item">
        <span class="dato-label"><i class="fas fa-credit-card"></i> DNI</span>
        <span class="dato-valor">{{ usuario.dni }}</span>
      </div>
      <div class="dato-item">
        <span class="dato-label"><i class="fas fa-map-marker-alt"></i> Dirección</span>
        <span class="dato-valor">{{ usuario.direccion }}</span>
      </div>
      <div class="dato-item">
        <span class="dato-label"><i class="fas fa-calendar-alt"></i> Fecha de nacimiento</span>
        <span class="dato-valor">{{ usuario.fechaNacimiento }}</span>
      </div>
      <div class="dato-item">
        <span class="dato-label"><i class="fas fa-bolt"></i> Categoría</span>
        <span class="dato-valor">{{ usuario.categoria }}</span>
      </div>
    </div>
  </div>

  <div class="datos-actions">
    <button class="btn-editar" disabled>
      <i class="fas fa-pencil-alt"></i> Editar datos
    </button>
  </div>

</div>
